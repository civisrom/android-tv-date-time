[versions]
# kadb-android требует kotlin-stdlib 2.4.0, поэтому компилятор не ниже
kotlin = "2.4.10"
agp = "9.4.0"
composeBom = "2026.08.00"
# Настоящая реализация лежит в kadb-android; артефакт com.flyfishxu:kadb —
# 744-байтная заглушка метаданных KMP без единого класса, проверено.
# kadb-mdns-android 2.1.3 НЕ подключается: его AndroidServiceInfoCallback и
# AndroidResolveListener вызывают сами себя вместо переданной лямбды и роняют
# процесс StackOverflowError на первом же найденном устройстве. Обнаружение
# написано поверх системного NsdManager — см. adb/NsdDeviceDiscovery.kt
kadb = "2.1.3"
coreKtx = "1.19.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
tvMaterial = "1.1.0"
junit = "4.13.2"
coroutines = "1.11.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# Compose for TV: leanback застрял в 1.3.0-alpha, tv-material стабилен
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }

kadb-android = { module = "com.flyfishxu:kadb-android", version.ref = "kadb" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
