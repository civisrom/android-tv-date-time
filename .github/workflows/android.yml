name: Android

# Сборка приложения. Отдельно от питоновского CI: у них разные предметы
# проверки, и запускать четырёхплатформенную матрицу Python ради правки в
# Kotlin бессмысленно.
on:
  push:
    branches: [dev, main]
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK на раннере предустановлен (ANDROID_HOME=/usr/local/lib/android/sdk,
      # платформы до android-37, build-tools 37.0.0) — доустанавливать нечего.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          build-scan-publish: false

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AndroidTVTimeFixer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

  ui:
    name: Интерфейс Android (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [23, 36]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          build-scan-publish: false

      - name: Build UI test APK
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug assembleDebugAndroidTest

      - name: Start Android emulator
        env:
          UI_TEST_API: ${{ matrix.api }}
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "system-images;android-${UI_TEST_API};google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name ui-test \
            --package "system-images;android-${UI_TEST_API};google_apis;x86_64" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd ui-test -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader -memory 2048 -cores 2 \
            > "$RUNNER_TEMP/ui-emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then
              adb shell input keyevent 82
              adb shell settings put global window_animation_scale 0
              adb shell settings put global transition_animation_scale 0
              adb shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run Compose UI regression tests
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 connectedDebugAndroidTest

      - name: Collect UI screenshots
        if: always()
        run: |
          mkdir -p ui-screenshots
          adb pull /sdcard/Android/data/com.civisrom.tvtimefixer/files/ui-screenshots/. ui-screenshots/ || true
          adb emu kill || true

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ui-api-${{ matrix.api }}
          path: |
            ui-screenshots/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/ui-emulator.log
          if-no-files-found: ignore
          retention-days: 7
