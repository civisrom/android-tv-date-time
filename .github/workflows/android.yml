name: Android

# Сборка приложения. Отдельно от питоновского CI: у них разные предметы
# проверки, и запускать четырёхплатформенную матрицу Python ради правки в
# Kotlin бессмысленно.
on:
  push:
    branches: [dev, main]
    paths:
      - 'android/**'
      - 'shared/**'
      - 'scripts/verify_android_apk.py'
      - '.github/workflows/android.yml'
      - '.github/android-ui-profiles.json'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/**'
      - 'scripts/verify_android_apk.py'
      - '.github/workflows/android.yml'
      - '.github/android-ui-profiles.json'
  workflow_dispatch:
    inputs:
      full_checks:
        description: 'Полная проверка: тесты, lint и матрица виртуальных устройств'
        type: boolean
        default: false
      ui_profile:
        description: 'Профиль для адресной проверки (например, phone-23); пусто — вся матрица. Требует full_checks=true'
        type: string
        default: ''
  workflow_call:
    inputs:
      full_checks:
        type: boolean
        # Release workflow callers retain the complete validation gate.
        default: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      ui-matrix: ${{ steps.ui-matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select UI profiles
        id: ui-matrix
        env:
          REQUESTED_UI_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.ui_profile || '' }}
          FULL_CHECKS: ${{ inputs.full_checks }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          matrix = json.loads(Path('.github/android-ui-profiles.json').read_text())
          requested = os.environ['REQUESTED_UI_PROFILE'].strip()
          if requested:
              if os.environ['FULL_CHECKS'] != 'true':
                  raise SystemExit('Selecting a UI profile requires full_checks=true')
              matrix['include'] = [p for p in matrix['include'] if p['name'] == requested]
              if not matrix['include']:
                  raise SystemExit('Unknown UI profile: ' + requested)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          print('Selected UI profiles: ' + ', '.join(p['name'] for p in matrix['include']))
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK на раннере предустановлен (ANDROID_HOME=/usr/local/lib/android/sdk,
      # платформы до android-37, build-tools 37.0.0) — доустанавливать нечего.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          build-scan-publish: false

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug

      - name: Assemble UI test APK
        if: inputs.full_checks == true
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebugAndroidTest

      - name: Assemble unsigned release APK
        if: inputs.full_checks == true
        working-directory: android
        run: ./gradlew --no-daemon --no-configuration-cache --no-build-cache assembleRelease

      - name: Unit tests
        if: inputs.full_checks == true
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Verify APK architectures and memory page alignment
        run: python3 scripts/verify_android_apk.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify release APK
        if: inputs.full_checks == true
        run: python3 scripts/verify_android_apk.py android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Lint
        if: inputs.full_checks == true
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AndroidTVTimeFixer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record UI input checksums
        if: inputs.full_checks == true
        working-directory: android/app/build/outputs/apk
        run: sha256sum debug/app-debug.apk androidTest/debug/app-debug-androidTest.apk > ui-inputs.sha256

      - name: Upload identical APKs for the emulator matrix
        if: inputs.full_checks == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ui-inputs
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android/app/build/outputs/apk/ui-inputs.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports on failure
        if: failure() && inputs.full_checks == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/build/reports/dependency-verification/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

  ui:
    name: APK — ${{ matrix.name }}
    needs: build
    if: inputs.full_checks == true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.build.outputs.ui-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Download tested APKs from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: android-ui-inputs
          path: android/app/build/outputs/apk

      - name: Verify identical inputs
        working-directory: android/app/build/outputs/apk
        run: sha256sum -c ui-inputs.sha256

      - name: Start Android emulator
        env:
          UI_TEST_IMAGE: ${{ matrix.image }}
          UI_TEST_DEVICE: ${{ matrix.device }}
        run: |
          set -o pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/ui-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > "$RUNNER_TEMP/sdk-licenses.log"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "$UI_TEST_IMAGE"
          # The emulator must see the runner's ephemeral ADB identity at boot.
          "$ANDROID_HOME/platform-tools/adb" start-server
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name ui-test \
            --package "$UI_TEST_IMAGE" --device "$UI_TEST_DEVICE" \
            --path "$ANDROID_AVD_HOME/ui-test.avd"
          test -f "$ANDROID_AVD_HOME/ui-test.ini"
          emulator_features=()
          emulator_memory=2048
          if [[ "$UI_TEST_IMAGE" == *'android-37.0;'* ]]; then
            emulator_memory=4096
            # Older avdmanager misreads the SDK's decimal api-level 37.0 as 0.
            # Correct only AVD metadata; keep the installed Android 17 system image.
            sed -n '/^target=/p' "$ANDROID_AVD_HOME/ui-test.ini"
            sed -i 's/^target=.*/target=android-37/' "$ANDROID_AVD_HOME/ui-test.ini" "$ANDROID_AVD_HOME/ui-test.avd/config.ini"
            grep -qx 'target=android-37' "$ANDROID_AVD_HOME/ui-test.ini"
            emulator_features=(-verbose)
          elif [[ "$UI_TEST_IMAGE" == *';google-tv-ps16k;'* || "$UI_TEST_IMAGE" == *';google_apis_playstore;'* ]]; then
            # With 2 GiB this image's first-boot services trigger LMK killing the IME.
            emulator_memory=4096
          fi
          "$ANDROID_HOME/emulator/emulator" -avd ui-test -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader -memory "$emulator_memory" -cores 2 -partition-size 4096 \
            "${emulator_features[@]}" \
            > "$RUNNER_TEMP/ui-emulator.log" 2>&1 &
          timeout 180 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          expected_api=${UI_TEST_IMAGE#*android-}
          expected_api=${expected_api%%;*}
          expected_api=${expected_api%%.*}
          ready_samples=0
          for _attempt in $(seq 1 120); do
            if [[ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then
              if [[ "$expected_api" == 23 ]]; then
                # First-boot encryption also sets boot_completed in a temporary framework.
                # Installing there races vold stopping main services and remounting /data.
                decrypt_state=$("$ANDROID_HOME/platform-tools/adb" shell getprop vold.decrypt | tr -d '\r')
                if [[ -n "$decrypt_state" && "$decrypt_state" != trigger_restart_framework ]]; then
                  ready_samples=0
                  sleep 2
                  continue
                fi
              fi
              # TV images can lose ADB transport just after boot_completed. Require a
              # stable read-only connection before the first (single) APK install.
              if ! timeout 10 "$ANDROID_HOME/platform-tools/adb" shell pm path android | grep -q '^package:'; then
                ready_samples=0
                sleep 2
                continue
              fi
              ready_samples=$((ready_samples + 1))
              if (( ready_samples < 4 )); then
                sleep 2
                continue
              fi
              test "$("$ANDROID_HOME/platform-tools/adb" shell getprop ro.build.version.sdk | tr -d '\r')" = "$expected_api"
              # MENU can trigger a launcher input ANR during first-boot work.
              # Wake/unlock through system services without sending a key to an app.
              "$ANDROID_HOME/platform-tools/adb" shell svc power stayon true
              "$ANDROID_HOME/platform-tools/adb" shell wm dismiss-keyguard
              "$ANDROID_HOME/platform-tools/adb" shell settings put global window_animation_scale 0
              "$ANDROID_HOME/platform-tools/adb" shell settings put global transition_animation_scale 0
              "$ANDROID_HOME/platform-tools/adb" shell settings put global animator_duration_scale 0
              if [[ "$expected_api" == 24 ]]; then
                # This image's unrelated Messenger crashes at boot and covers the test UI.
                "$ANDROID_HOME/platform-tools/adb" shell pm disable-user --user 0 com.google.android.apps.messaging
                "$ANDROID_HOME/platform-tools/adb" shell am force-stop com.google.android.apps.messaging
              fi
              # Separate short probes can reconnect silently during TV first-boot setup.
              # Keep one transport alive after setup before the first APK installation.
              if ! timeout 30 "$ANDROID_HOME/platform-tools/adb" shell '
                for sample in 1 2 3 4 5 6 7 8; do
                  pm path android | grep -q "^package:" || exit 1
                  sleep 2
                done
              '; then
                ready_samples=0
                sleep 2
                continue
              fi
              timeout 1500 "$ANDROID_HOME/platform-tools/adb" logcat -v threadtime > "$RUNNER_TEMP/ui-live-logcat.txt" 2>&1 &
              echo $! > "$RUNNER_TEMP/ui-logcat.pid"
              exit 0
            else
              ready_samples=0
            fi
            sleep 2
          done
          exit 1

      - name: Install APKs for device tests
        id: install_apks
        timeout-minutes: 10
        working-directory: android
        run: |
          timeout 300 "$ANDROID_HOME/platform-tools/adb" install --no-streaming -r -t app/build/outputs/apk/debug/app-debug.apk
          timeout 300 "$ANDROID_HOME/platform-tools/adb" install --no-streaming -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Verify real wireless pairing, reconnect, file transfer and APK installation
        if: ${{ !cancelled() && matrix.name == 'phone-36' && steps.install_apks.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -o pipefail
          "$ANDROID_HOME/platform-tools/adb" shell am force-stop com.civisrom.tvtimefixer
          timeout 240 "$ANDROID_HOME/platform-tools/adb" shell am instrument -w -r \
            -e timeout_msec 180000 -e real_wireless_pairing true \
            -e class com.civisrom.tvtimefixer.adb.WirelessAdbIntegrationTest \
            com.civisrom.tvtimefixer.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/ui-wireless.log"
          grep -Eq '^OK \(1 test\)' "$RUNNER_TEMP/ui-wireless.log"
          ! grep -Eq '^INSTRUMENTATION_STATUS_CODE: -[1-4][[:space:]]*$' "$RUNNER_TEMP/ui-wireless.log"

      - name: Upload wireless test result
        if: ${{ !cancelled() && matrix.name == 'phone-36' && steps.install_apks.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-wireless-phone-36
          path: ${{ runner.temp }}/ui-wireless.log
          if-no-files-found: error
          retention-days: 7

      - name: Run Compose UI regression tests
        if: ${{ !cancelled() && steps.install_apks.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: android
        env:
          UI_TEST_TV: ${{ matrix.tv }}
          UI_TEST_PAGE_SIZE: ${{ matrix.page_size }}
        # Явные установка и запуск позволяют отличить сбой ADB от сбоя тестов.
        # APK остаются установленными до сбора скриншотов.
        run: |
          set -o pipefail
          # Отдельные процессы ограничивают накопление Surface/IME в старых
          # системных образах. Каждый тест выполняется один раз; сбои не скрываем повтором.
          ui_failed=0
          for shard in 0 1 2; do
            "$ANDROID_HOME/platform-tools/adb" shell am force-stop com.civisrom.tvtimefixer
            if ! timeout 600 "$ANDROID_HOME/platform-tools/adb" shell am instrument -w -r -e timeout_msec 60000 \
              -e notClass com.civisrom.tvtimefixer.adb.WirelessAdbIntegrationTest \
              -e numShards 3 -e shardIndex "$shard" \
              -e expected_tv "$UI_TEST_TV" -e expected_page_size "$UI_TEST_PAGE_SIZE" \
              com.civisrom.tvtimefixer.test/androidx.test.runner.AndroidJUnitRunner \
              | tee "$RUNNER_TEMP/ui-shard-$shard.log"; then
              ui_failed=1
            fi
            cat "$RUNNER_TEMP/ui-shard-$shard.log" >> "$RUNNER_TEMP/ui-instrumentation.log"
            # am instrument может вернуть код 0 даже при проваленных JUnit-тестах.
            if ! grep -Eq '^OK \([1-9][0-9]* tests?\)' "$RUNNER_TEMP/ui-shard-$shard.log"; then
              ui_failed=1
            fi
          done
          exit "$ui_failed"

      - name: Repeat terminal activity and keyboard transitions on Android 6
        if: success() && matrix.name == 'phone-23'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Fixed checks of both failing activity/keyboard transitions, never retry-until-green.
          # Stop at the first failed, skipped, missing, reordered or timed-out test.
          terminal_class=com.civisrom.tvtimefixer.ui.TerminalScreenTest
          run_sequence() {
            local phase="$1"
            shift
            local methods=("$@")
            local selection="$terminal_class#${methods[0]}"
            local method
            for method in "${methods[@]:1}"; do
              selection+=",$terminal_class#$method"
            done
            local result="$RUNNER_TEMP/ui-terminal-$phase-repeat-$iteration.log"
            "$ANDROID_HOME/platform-tools/adb" shell am force-stop com.civisrom.tvtimefixer
            timeout 180 "$ANDROID_HOME/platform-tools/adb" shell am instrument -w -r \
              -e timeout_msec 60000 -e class "$selection" \
              com.civisrom.tvtimefixer.test/androidx.test.runner.AndroidJUnitRunner | tee "$result"
            python3 - "$result" "${methods[@]}" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          expected = sys.argv[2:]
          if len(expected) not in (2, 3):
              raise SystemExit('Unexpected terminal transition group size')
          started, completed = [], []
          current = None
          for line in text.splitlines():
              if line.startswith('INSTRUMENTATION_STATUS: test='):
                  current = line.split('=', 1)[1]
              elif line.startswith('INSTRUMENTATION_STATUS_CODE: '):
                  code = int(line.split(': ', 1)[1])
                  if code not in (0, 1) or current is None:
                      raise SystemExit('Unexpected instrumentation status: ' + line)
                  (started if code == 1 else completed).append(current)
                  current = None
          if started != expected or completed != expected or not re.search(rf'^OK \({len(expected)} tests\)\s*$', text, re.M):
              raise SystemExit('Terminal transition sequence did not pass exactly once in the required order')
          print('Verified terminal transition sequence: ' + sys.argv[1])
          PY
          }
          for iteration in $(seq -w 1 20); do
            # Separate groups retain both adjacencies under JUnit's default method order.
            run_sequence clear \
              TV_reference_search_reaches_category_with_sequential_Dpad \
              insert_from_reference_fills_editor_without_running_and_places_cursor_at_the_end \
              clearing_the_command_line_preserves_the_result_and_history
            run_sequence scroll \
              native_touch_clears_the_focused_editor_with_the_keyboard_visible \
              scrolling_long_output_keeps_editor_run_and_clear_controls_in_place
          done

      - name: Collect UI screenshots and IME timeout details
        if: always()
        run: |
          mkdir -p ui-screenshots
          # Scoped storage blocks shell access on some TV builds; debug run-as uses the app UID.
          if names=$(timeout 15 "$ANDROID_HOME/platform-tools/adb" shell run-as com.civisrom.tvtimefixer ls files/ui-screenshots); then
            while IFS= read -r name; do
              name=${name//$'\r'/}
              [[ "$name" =~ ^([a-zA-Z0-9._-]+\.png|ime-timeout-[a-zA-Z0-9._-]+\.txt|native-terminal-(disconnected|back|clear|clear-ime|clear-ime-cleanup|scroll)-failure\.txt)$ ]] || continue
              if ! timeout 15 "$ANDROID_HOME/platform-tools/adb" exec-out run-as com.civisrom.tvtimefixer \
                cat "files/ui-screenshots/$name" > "ui-screenshots/$name"; then
                rm -f -- "ui-screenshots/$name"
              fi
            done <<< "$names"
          fi
          timeout 15 "$ANDROID_HOME/platform-tools/adb" logcat -d -t 1000 > "$RUNNER_TEMP/ui-logcat.txt" || true
          timeout 15 "$ANDROID_HOME/platform-tools/adb" logcat -b crash -d > "$RUNNER_TEMP/ui-crashes.txt" || true
          timeout 15 "$ANDROID_HOME/platform-tools/adb" shell dumpsys display > "$RUNNER_TEMP/ui-display.txt" || true
          timeout 15 "$ANDROID_HOME/platform-tools/adb" shell dumpsys window > "$RUNNER_TEMP/ui-window.txt" || true
          timeout 15 "$ANDROID_HOME/platform-tools/adb" shell cat /proc/meminfo > "$RUNNER_TEMP/ui-memory.txt" || true
          timeout 15 "$ANDROID_HOME/platform-tools/adb" exec-out screencap -p > ui-screenshots/emulator-final.png || true
          if [[ -f "$RUNNER_TEMP/ui-logcat.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/ui-logcat.pid")" || true
          fi
          timeout 10 "$ANDROID_HOME/platform-tools/adb" emu kill || true

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ui-${{ matrix.name }}
          path: |
            ui-screenshots/
            ${{ runner.temp }}/ui-instrumentation.log
            ${{ runner.temp }}/ui-shard-*.log
            ${{ runner.temp }}/ui-terminal-clear-repeat-*.log
            ${{ runner.temp }}/ui-terminal-scroll-repeat-*.log
            ${{ runner.temp }}/ui-wireless.log
            ${{ runner.temp }}/ui-emulator.log
            ${{ runner.temp }}/ui-logcat.txt
            ${{ runner.temp }}/ui-crashes.txt
            ${{ runner.temp }}/ui-display.txt
            ${{ runner.temp }}/ui-window.txt
            ${{ runner.temp }}/ui-memory.txt
            ${{ runner.temp }}/ui-live-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
