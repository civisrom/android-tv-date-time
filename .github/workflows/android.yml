name: Android

# Сборка приложения. Отдельно от питоновского CI: у них разные предметы
# проверки, и запускать четырёхплатформенную матрицу Python ради правки в
# Kotlin бессмысленно.
on:
  push:
    branches: [dev, main]
    paths:
      - 'android/**'
      - 'shared/**'
      - 'scripts/verify_android_apk.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/**'
      - 'scripts/verify_android_apk.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK на раннере предустановлен (ANDROID_HOME=/usr/local/lib/android/sdk,
      # платформы до android-37, build-tools 37.0.0) — доустанавливать нечего.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          build-scan-publish: false

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble unsigned release APK
        working-directory: android
        run: ./gradlew --no-daemon --no-configuration-cache --no-build-cache assembleRelease

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Verify APK architectures and memory page alignment
        run: |
          python3 scripts/verify_android_apk.py android/app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify_android_apk.py android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AndroidTVTimeFixer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/build/reports/dependency-verification/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

  ui:
    name: APK — ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: android-tv-36
            image: system-images;android-36;android-tv;x86_64
            device: tv_1080p
            tv: true
            page_size: 4096
          - name: google-tv-36-16k
            image: system-images;android-36;google-tv-ps16k;x86_64
            device: tv_1080p
            tv: true
            page_size: 16384
          - name: phone-37.0
            image: system-images;android-37.0;google_apis;x86_64
            device: pixel_2
            tv: false
            page_size: 4096
          - name: android-tv-30
            image: system-images;android-30;android-tv;x86
            device: tv_1080p
            tv: true
            page_size: 4096
          - name: google-tv-30
            image: system-images;android-30;google-tv;x86
            device: tv_1080p
            tv: true
            page_size: 4096
          - name: android-tv-34
            image: system-images;android-34;android-tv;x86
            device: tv_1080p
            tv: true
            page_size: 4096
          - name: google-tv-34
            image: system-images;android-34;google-tv;x86
            device: tv_1080p
            tv: true
            page_size: 4096
          - name: phone-31
            image: system-images;android-31;google_apis;x86_64
            device: pixel_2
            tv: false
            page_size: 4096
          - name: phone-29
            image: system-images;android-29;google_apis;x86_64
            device: pixel_2
            tv: false
            page_size: 4096
          - name: phone-30
            image: system-images;android-30;google_apis;x86_64
            device: pixel_2
            tv: false
            page_size: 4096
          - name: phone-33
            image: system-images;android-33;google_apis;x86_64
            device: pixel_2
            tv: false
            page_size: 4096
          - name: phone-34
            image: system-images;android-34;google_apis;x86_64
            device: pixel_2
            tv: false
            page_size: 4096
          - name: phone-35
            image: system-images;android-35;google_apis;x86_64
            device: pixel_2
            tv: false
            page_size: 4096
          - name: phone-36
            image: system-images;android-36;google_apis;x86_64
            device: pixel_2
            tv: false
            page_size: 4096
          - name: phone-28
            image: system-images;android-28;google_apis;x86_64
            device: pixel_2
            tv: false
            page_size: 4096
          - name: phone-26
            image: system-images;android-26;google_apis;x86_64
            device: pixel_2
            tv: false
            page_size: 4096
          - name: phone-24
            image: system-images;android-24;google_apis;x86_64
            device: pixel_2
            tv: false
            page_size: 4096
          - name: phone-23
            image: system-images;android-23;google_apis;x86_64
            device: pixel_2
            tv: false
            page_size: 4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          build-scan-publish: false

      - name: Build UI test APK
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug assembleDebugAndroidTest

      - name: Start Android emulator
        env:
          UI_TEST_IMAGE: ${{ matrix.image }}
          UI_TEST_DEVICE: ${{ matrix.device }}
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/ui-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > "$RUNNER_TEMP/sdk-licenses.log"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "$UI_TEST_IMAGE"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name ui-test \
            --package "$UI_TEST_IMAGE" --device "$UI_TEST_DEVICE" \
            --path "$ANDROID_AVD_HOME/ui-test.avd"
          test -f "$ANDROID_AVD_HOME/ui-test.ini"
          emulator_features=()
          if [[ "$UI_TEST_IMAGE" == *'android-37.0;'* ]]; then
            # API 37 mapper.ranchu aborts when the host advertises ReadColorBufferDMA.
            # Disable its GLDirectMem prerequisite; keep the system UI and all APK tests enabled.
            emulator_features=(-feature -GLDirectMem)
          fi
          "$ANDROID_HOME/emulator/emulator" -avd ui-test -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader -memory 2048 -cores 2 -partition-size 4096 \
            "${emulator_features[@]}" \
            > "$RUNNER_TEMP/ui-emulator.log" 2>&1 &
          timeout 180 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for attempt in $(seq 1 120); do
            if [[ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then
              "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
              "$ANDROID_HOME/platform-tools/adb" shell settings put global window_animation_scale 0
              "$ANDROID_HOME/platform-tools/adb" shell settings put global transition_animation_scale 0
              "$ANDROID_HOME/platform-tools/adb" shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run Compose UI regression tests
        timeout-minutes: 20
        working-directory: android
        env:
          UI_TEST_TV: ${{ matrix.tv }}
          UI_TEST_PAGE_SIZE: ${{ matrix.page_size }}
        # Явные установка и запуск позволяют отличить сбой ADB от сбоя тестов.
        # APK остаются установленными до сбора скриншотов.
        run: |
          set -o pipefail
          timeout 300 "$ANDROID_HOME/platform-tools/adb" install --no-streaming -r -t app/build/outputs/apk/debug/app-debug.apk
          timeout 300 "$ANDROID_HOME/platform-tools/adb" install --no-streaming -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          # Отдельные процессы ограничивают накопление Surface/IME в старых
          # системных образах. Каждый тест выполняется один раз; сбои не скрываем повтором.
          for shard in 0 1 2; do
            "$ANDROID_HOME/platform-tools/adb" shell am force-stop com.civisrom.tvtimefixer
            timeout 600 "$ANDROID_HOME/platform-tools/adb" shell am instrument -w -r -e timeout_msec 60000 \
              -e numShards 3 -e shardIndex "$shard" \
              -e expected_tv "$UI_TEST_TV" -e expected_page_size "$UI_TEST_PAGE_SIZE" \
              com.civisrom.tvtimefixer.test/androidx.test.runner.AndroidJUnitRunner \
              | tee "$RUNNER_TEMP/ui-shard-$shard.log"
            cat "$RUNNER_TEMP/ui-shard-$shard.log" >> "$RUNNER_TEMP/ui-instrumentation.log"
            # am instrument может вернуть код 0 даже при проваленных JUnit-тестах.
            grep -Eq '^OK \([1-9][0-9]* tests?\)' "$RUNNER_TEMP/ui-shard-$shard.log"
          done

      - name: Collect UI screenshots
        if: always()
        run: |
          mkdir -p ui-screenshots
          timeout 30 "$ANDROID_HOME/platform-tools/adb" pull /sdcard/Android/data/com.civisrom.tvtimefixer/files/ui-screenshots/. ui-screenshots/ || true
          timeout 15 "$ANDROID_HOME/platform-tools/adb" logcat -d -t 1000 > "$RUNNER_TEMP/ui-logcat.txt" || true
          timeout 15 "$ANDROID_HOME/platform-tools/adb" logcat -b crash -d > "$RUNNER_TEMP/ui-crashes.txt" || true
          timeout 10 "$ANDROID_HOME/platform-tools/adb" emu kill || true

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ui-${{ matrix.name }}
          path: |
            ui-screenshots/
            ${{ runner.temp }}/ui-instrumentation.log
            ${{ runner.temp }}/ui-emulator.log
            ${{ runner.temp }}/ui-logcat.txt
            ${{ runner.temp }}/ui-crashes.txt
          if-no-files-found: ignore
          retention-days: 7
