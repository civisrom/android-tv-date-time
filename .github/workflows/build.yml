name: Build AndroidTVTimeFixer

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm build'
        required: true
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: '3.11'
  APP_NAME: AndroidTVTimeFixer
  SOURCE_FILE: src/android_time_fixer.py
  POETRY_VERSION: '2.3.4'
  ADB_VERSION: '37.0.1'

jobs:
  setup-and-build:
    name: Build for ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            adb_url: https://dl.google.com/android/repository/platform-tools_r37.0.1-win.zip
            adb_sha256: 45f4d63113e895ebde0c90f194099a4676b6ac653bd28d54314a9e022bbc1a99
            adb_base: "adb.exe AdbWinApi.dll AdbWinUsbApi.dll"
          - os: ubuntu-22.04
            platform: Linux
            adb_url: https://dl.google.com/android/repository/platform-tools_r37.0.1-linux.zip
            adb_sha256: d230f13842f60f782a8645f9c813f8f845bf36089ea7289f28c48f17979313f1
            adb_base: "adb"
          - os: macos-latest
            platform: macOS
            adb_url: https://dl.google.com/android/repository/platform-tools_r37.0.1-darwin.zip
            adb_sha256: ee39ad5967e95c2a07f04dbcbde96b1a0c916ba376096db5d2f498b7727a5d1d
            adb_base: "adb"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          
      - name: Require manual confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'YES'
        run: exit 1
        
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Poetry cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .venv
            ~/AppData/Local/pypoetry/Cache
            ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
            poetry-${{ runner.os }}-

      - name: Install Poetry
        run: python -m pip install "poetry==${{ env.POETRY_VERSION }}"
        shell: bash

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry env use python
        shell: bash

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev libudev-dev
        shell: bash

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          # Suppress warning if openssl is already installed
          brew list openssl@3 &>/dev/null || brew install openssl@3
        shell: bash

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev --all-extras
        shell: bash

      - name: Setup ADB
        shell: bash
        run: |
          mkdir -p resources temp_adb
          curl --fail --show-error --location ${{ matrix.adb_url }} -o temp_adb/platform-tools.zip
          python -c "import hashlib, pathlib, sys; p = pathlib.Path('temp_adb/platform-tools.zip'); actual = hashlib.file_digest(p.open('rb'), 'sha256').hexdigest(); expected = '${{ matrix.adb_sha256 }}'; print(f'ADB SHA256: {actual}'); sys.exit(0 if actual == expected else 'ADB checksum mismatch')"
          unzip -o temp_adb/platform-tools.zip -d temp_adb/
          
          for file in ${{ matrix.adb_base }}; do
            cp "temp_adb/platform-tools/$file" "resources/$file"
            if [[ "$file" != *".dll" ]]; then
              chmod +x "resources/$file"
            fi
          done
          
          rm -rf temp_adb
          
      - name: Check Poetry source
        run: poetry config --list

      - name: Validate project
        run: |
          poetry check --lock
          poetry run python -m py_compile src/android_time_fixer.py locales.py scripts/hooks/linux_hook.py scripts/hooks/macos_hook.py scripts/hooks/win_hook.py scripts/generate_icon.py
          poetry run flake8 --select=F src/android_time_fixer.py locales.py scripts tests
          poetry run python -m unittest discover -s tests -v
        shell: bash

      - name: Generate application icon
        run: poetry run python scripts/generate_icon.py
        shell: bash

      - name: Build executable
        run: poetry run pyinstaller --clean pyinstaller.spec
        shell: bash

      - name: Smoke-test executable
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./dist/${{ env.APP_NAME }}.exe --version
          else
            ./dist/${{ env.APP_NAME }} --version
          fi
        shell: bash

      - name: Package build
        run: |
          cd dist
          PLATFORM_LOWER=$(echo "${{ matrix.platform }}" | tr '[:upper:]' '[:lower:]')
          # Лицензии обязаны ехать вместе с бинарником: в него вшиты adb под
          # Apache-2.0 и python-zeroconf под LGPL-2.1
          cp ../LICENSE ../NOTICE ../THIRD-PARTY-NOTICES.md .
          if [ "${{ runner.os }}" == "Windows" ]; then
            # Включаем start.bat и start.ps1 в Windows-архив
            cp ../start.bat . 2>/dev/null || true
            cp ../start.ps1 . 2>/dev/null || true
            7z a -tzip "${{ env.APP_NAME }}-${PLATFORM_LOWER}.zip" "${{ env.APP_NAME }}.exe" start.bat start.ps1 LICENSE NOTICE THIRD-PARTY-NOTICES.md
          else
            chmod +x "${{ env.APP_NAME }}"
            zip -j "${{ env.APP_NAME }}-${PLATFORM_LOWER}.zip" "${{ env.APP_NAME }}" LICENSE NOTICE THIRD-PARTY-NOTICES.md
          fi
          python -c "import glob, hashlib, pathlib; p = pathlib.Path(glob.glob('${{ env.APP_NAME }}-*.zip')[0]); digest = hashlib.file_digest(p.open('rb'), 'sha256').hexdigest(); pathlib.Path(str(p) + '.sha256').write_text(f'{digest}  {p.name}\n', encoding='ascii')"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.platform }}
          path: |
            dist/${{ env.APP_NAME }}-*.zip
            dist/${{ env.APP_NAME }}-*.sha256
          retention-days: 90
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require manual confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'YES'
        run: exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4
        with:
          build-scan-publish: false

      - name: Derive version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "name=0.0.0-run${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      # Ключ приходит только из секретов. Его отсутствие не валит релиз
      # десктопной половины: APK тогда собирается неподписанным, попадает в
      # артефакты сборки под именем unsigned-* и не проходит в Releases.
      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> $GITHUB_OUTPUT
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - the APK will be unsigned and will not be attached to the release"
          else
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> $GITHUB_OUTPUT
          fi

      # Тесты гоняются здесь, а не только в android.yml: тот запускается по
      # push в ветки, релиз же идёт по тегу и иначе выпускался бы непроверенным.
      # Юнит-тесты существуют только в debug-варианте — AGP не создаёт для
      # release задачу testReleaseUnitTest, а исходники тестов одни и те же;
      # lint при этом берётся именно релизный.
      - name: Unit tests and lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease

      - name: Assemble release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        # Do not serialize the signing configuration/passwords into a configuration cache.
        run: ./gradlew --no-daemon --no-configuration-cache assembleRelease

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Package APK
        run: |
          mkdir -p dist
          SOURCE=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SOURCE" ]; then
            # Неподписанная сборка кладёт файл под другим именем
            SOURCE=android/app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          if [ "${{ steps.signing.outputs.signed }}" == "true" ]; then
            TARGET="dist/${{ env.APP_NAME }}-${{ steps.version.outputs.name }}.apk"
          else
            TARGET="dist/unsigned-${{ env.APP_NAME }}-${{ steps.version.outputs.name }}.apk"
          fi
          cp "$SOURCE" "$TARGET"
          if [ "${{ steps.signing.outputs.signed }}" == "true" ]; then
            python3 -c "import pathlib, sys, hashlib; p = pathlib.Path(sys.argv[1]); digest = hashlib.file_digest(p.open('rb'), 'sha256').hexdigest(); pathlib.Path(str(p) + '.sha256').write_text(f'{digest}  {p.name}\n', encoding='ascii')" "$TARGET"
          fi
          # У скачавшего APK нет архива с лицензиями, который получает
          # десктопная половина. GPL-3.0 здесь обязателен, а не для полноты:
          # spake2-java внутри APK под ней, значит и весь APK тоже
          cp LICENSE LICENSE-GPL-3.0.txt NOTICE THIRD-PARTY-NOTICES.md dist/

      # Подпись проверяется на собранном файле, а не по коду возврата Gradle:
      # сборка с пустым signingConfig проходит успешно и молча даёт APK,
      # который нельзя установить
      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs \
            "dist/${{ env.APP_NAME }}-${{ steps.version.outputs.name }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.APP_NAME }}-Android
          path: |
            dist/*.apk
            dist/*.apk.sha256
            dist/LICENSE
            dist/LICENSE-GPL-3.0.txt
            dist/NOTICE
            dist/THIRD-PARTY-NOTICES.md
          retention-days: 90
          if-no-files-found: error

  create-release:
    needs: [setup-and-build, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    
    steps:
      - name: Checkout release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare bilingual release notes
        id: notes
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_PRERELEASE: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          BODY="$RUNNER_TEMP/release-notes.md"
          RU="release-notes/$RELEASE_TAG-ru.md"
          EN="release-notes/$RELEASE_TAG-en.md"
          if [[ -f "$RU" && -f "$EN" ]]; then
            cat "$RU" > "$BODY"
            printf '\n\n---\n\n' >> "$BODY"
            cat "$EN" >> "$BODY"
          else
            printf '%s\n\n' \
              '**Приложение для Android работает в тестовом режиме.**' \
              '**The Android app operates in test mode.**' > "$BODY"
          fi
          printf '\n\n%s\n\n%s\n' \
            'APK: GPL-3.0 (LICENSE-GPL-3.0.txt); исходный код проекта и desktop: Apache-2.0.' \
            'APK: GPL-3.0 (LICENSE-GPL-3.0.txt); project sources and desktop: Apache-2.0.' >> "$BODY"
          PRERELEASE="$DEFAULT_PRERELEASE"
          METADATA="release-notes/$RELEASE_TAG.json"
          if [[ -f "$METADATA" ]]; then
            PRERELEASE=$(jq -er '.prerelease | select(type == "boolean") | tostring' "$METADATA")
          fi
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/*.zip
            dist/*.sha256
            dist/AndroidTVTimeFixer-*.apk
            dist/LICENSE
            dist/LICENSE-GPL-3.0.txt
            dist/NOTICE
            dist/THIRD-PARTY-NOTICES.md
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}
          generate_release_notes: true
