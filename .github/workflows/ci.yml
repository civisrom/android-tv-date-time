name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    # Правки только в Android-модуле не должны гонять питоновскую матрицу:
    # зелёный статус здесь означал бы, что проверено то, чего не проверяли.
    # Их проверяет отдельный workflow android.yml.
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '2.3.4'

jobs:
  test:
    name: Тесты (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.11'
            artifact_platform: Linux
            adb_platform: linux
            adb_sha256: d230f13842f60f782a8645f9c813f8f845bf36089ea7289f28c48f17979313f1
          - os: ubuntu-22.04
            python: '3.12'
            adb_platform: linux
          # Google не выпускает adb для Linux ARM64: он собирается из android-tools.
          - os: ubuntu-22.04-arm
            python: '3.11'
            artifact_platform: Linux-ARM64
            adb_source: android-tools
            adb_sha256: d230f13842f60f782a8645f9c813f8f845bf36089ea7289f28c48f17979313f1
          - os: windows-latest
            python: '3.12.15'
            bootstrap_python: '3.11'
            artifact_platform: Windows
            adb_platform: win
            adb_sha256: 45f4d63113e895ebde0c90f194099a4676b6ac653bd28d54314a9e022bbc1a99
          - os: macos-15
            python: '3.12.15'
            bootstrap_python: '3.11'
            artifact_platform: macOS
            adb_platform: darwin
            adb_sha256: ee39ad5967e95c2a07f04dbcbde96b1a0c916ba376096db5d2f498b7727a5d1d
          - os: macos-15-intel
            python: '3.12.15'
            bootstrap_python: '3.11'
            artifact_platform: macOS-Intel
            adb_platform: darwin
            adb_sha256: ee39ad5967e95c2a07f04dbcbde96b1a0c916ba376096db5d2f498b7727a5d1d
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (matrix.os == 'macos-15-intel' || matrix.adb_source) && 30 || 15 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.bootstrap_python || matrix.python }}
          cache: pip

      - name: Select verified build Python
        shell: bash
        run: python scripts/setup_build_python.py --destination "$RUNNER_TEMP/desktop-python"

      - name: Install Poetry
        run: python -m pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Configure static OpenSSL for macOS Intel
        if: matrix.os == 'macos-15-intel'
        timeout-minutes: 15
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        shell: bash
        run: |
          brew update
          # The runner image points /usr/local/bin/openssl at openssl@1.1 outside
          # Homebrew's own links, so `brew unlink` keeps it and linking openssl@3
          # (3.5 LTS) fails after it is built. Remove only that stale symlink.
          if [ "$(readlink /usr/local/bin/openssl)" = /usr/local/opt/openssl@1.1/bin/openssl ]; then
            rm /usr/local/bin/openssl
          fi
          brew upgrade openssl@3
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install project
        shell: bash
        run: |
          poetry env use "$BUILD_PYTHON_EXECUTABLE"
          poetry install --no-interaction --with dev

      - name: Verify native OpenSSL versions
        run: poetry run python scripts/verify_native_crypto.py

      - name: Verify static OpenSSL for macOS Intel
        if: matrix.os == 'macos-15-intel'
        run: poetry run python scripts/verify_macos_crypto.py

      - name: Validate metadata and lock file
        run: poetry check --lock

      - name: Check Python sources
        run: |
          poetry run python -c "import android_time_fixer"
          poetry run python -m py_compile src/android_time_fixer.py locales.py scripts/hooks/linux_hook.py scripts/hooks/macos_hook.py scripts/hooks/win_hook.py scripts/generate_icon.py
          poetry run flake8 --select=F src locales.py scripts tests

      - name: Run regression tests
        run: poetry run python -m unittest discover -s tests -v

      - name: Verify Python package contents
        shell: bash
        run: |
          poetry build --format wheel
          poetry run python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          with zipfile.ZipFile(wheel) as package:
              expected = {p.name for p in pathlib.Path('src').glob('*.py')} | {'locales.py'}
              assert expected <= set(package.namelist()), 'Python package is missing application modules'
          PY

      # Проверяем native ADB: моки не обнаруживают различия его ОС-бэкендов
      # и правил автозапуска сервера. Никакие устройства CI не изменяет.
      - name: Prepare verified Platform Tools for USB tests and packaging
        if: matrix.adb_source != 'android-tools'
        shell: bash
        env:
          ADB_PLATFORM: ${{ matrix.adb_platform }}
          ADB_SHA256: ${{ matrix.adb_sha256 }}
        run: |
          curl --fail --show-error --location --retry 3 \
            "https://dl.google.com/android/repository/platform-tools_r37.0.1-${ADB_PLATFORM}.zip" \
            -o "$RUNNER_TEMP/usb-platform-tools.zip"
          python - <<'PY'
          import hashlib, os, pathlib, zipfile
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'usb-platform-tools.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['ADB_SHA256'], 'ADB SHA256 mismatch'
          destination = pathlib.Path('resources')
          destination.mkdir(exist_ok=True)
          names = ['adb.exe', 'AdbWinApi.dll', 'AdbWinUsbApi.dll'] if os.name == 'nt' else ['adb']
          with zipfile.ZipFile(archive) as source:
              for name in names:
                  target = destination / name
                  target.write_bytes(source.read('platform-tools/' + name))
                  target.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('USB_TEST_ADB=' + str(destination / names[0]) + '\n')
          PY

      - name: Build adb from pinned android-tools sources
        if: matrix.adb_source == 'android-tools'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(python scripts/build_adb.py --print-apt-packages)
          python scripts/build_adb.py
          echo "USB_TEST_ADB=resources/adb" >> "$GITHUB_ENV"

      - name: Probe native USB discovery
        shell: bash
        run: poetry run python scripts/probe_usb_adb.py --adb "$USB_TEST_ADB"

      - name: Select real console window for the close-event test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Disposable runner only. WM_CLOSE cannot close the message-only
          # PseudoConsoleWindow returned by a delegated Windows Terminal.
          $consoleKey = 'HKCU:\Console\%%Startup'
          New-Item -Path $consoleKey -Force | Out-Null
          foreach ($valueName in @('DelegationConsole', 'DelegationTerminal')) {
            New-ItemProperty -Path $consoleKey -Name $valueName -PropertyType String -Force `
              -Value '{B23D10C0-E52E-411E-9D5B-C09FDF709C7D}' | Out-Null
          }

      - name: Verify native ADB cleanup and Windows console close
        shell: bash
        run: poetry run python scripts/probe_adb_cleanup.py --adb "$USB_TEST_ADB"

      - name: Build and smoke-test desktop executable
        shell: bash
        run: |
          poetry run python scripts/generate_icon.py
          poetry run pyinstaller --clean --noconfirm pyinstaller.spec
          if [[ "$RUNNER_OS" == Windows ]]; then
            ./dist/AndroidTVTimeFixer.exe --version
            poetry run python scripts/smoke_desktop.py ./dist/AndroidTVTimeFixer.exe
          else
            ./dist/AndroidTVTimeFixer --version
            poetry run python scripts/smoke_desktop.py ./dist/AndroidTVTimeFixer
          fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            test "$(lipo -archs ./dist/AndroidTVTimeFixer)" = "$(uname -m)"
          fi

      - name: Audit every bundled file against OSV
        run: poetry run python scripts/audit_bundle.py build/pyinstaller

      - name: Package desktop test build
        if: matrix.artifact_platform != ''
        shell: bash
        env:
          ARTIFACT_PLATFORM: ${{ matrix.artifact_platform }}
        run: |
          python - <<'PYCODE'
          import hashlib
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          platform = os.environ['ARTIFACT_PLATFORM'].lower()
          archive = Path(f'dist/AndroidTVTimeFixer-{platform}.zip')
          executable = 'AndroidTVTimeFixer.exe' if os.name == 'nt' else 'AndroidTVTimeFixer'
          files = [f'dist/{executable}', 'LICENSE', 'NOTICE', 'THIRD-PARTY-NOTICES.md']
          if os.name == 'nt':
              files += ['start.bat', 'start.ps1']
          with ZipFile(archive, 'w', compression=ZIP_DEFLATED) as output:
              for name in files:
                  source = Path(name)
                  output.write(source, source.name)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(str(archive) + '.sha256').write_text(f'{digest}  {archive.name}\n', encoding='ascii')
          PYCODE

      - name: Upload desktop test build
        if: matrix.artifact_platform != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AndroidTVTimeFixer-${{ matrix.artifact_platform }}-dev
          path: |
            dist/AndroidTVTimeFixer-*.zip
            dist/AndroidTVTimeFixer-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  # Те же архивы, что пользователи скачивают, на системах без библиотек раннера.
  linux-systems:
    name: Чистые Linux-системы (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
          - os: ubuntu-22.04-arm
            platform: Linux-ARM64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download desktop test build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: AndroidTVTimeFixer-${{ matrix.platform }}-dev
          path: dist

      - name: Run on Ubuntu 22.04, Debian 12 and Ubuntu 24.04 containers
        shell: bash
        run: python3 scripts/smoke_linux_systems.py dist/AndroidTVTimeFixer-*.zip

  # Windows 11 на ARM запускает x64-сборку через встроенную эмуляцию.
  windows-arm:
    name: Windows 11 ARM (x64-сборка в эмуляции)
    needs: test
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install locked psutil for the smoke test
        shell: bash
        run: |
          python - > "$RUNNER_TEMP/smoke-requirements.txt" <<'PY'
          import tomllib
          lock = tomllib.load(open('poetry.lock', 'rb'))
          package = next(p for p in lock['package'] if p['name'] == 'psutil')
          print(f"psutil=={package['version']} " + ' '.join(f"--hash={f['hash']}" for f in package['files']))
          PY
          python -m pip install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/smoke-requirements.txt"

      - name: Download desktop test build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: AndroidTVTimeFixer-Windows-dev
          path: dist

      - name: Smoke-test the x64 build on ARM64
        shell: bash
        run: python scripts/smoke_windows_arm.py dist/AndroidTVTimeFixer-windows.zip
